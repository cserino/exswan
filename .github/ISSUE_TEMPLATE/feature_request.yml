name: Feature request
description: Propose a focused change to ExSwan
title: "[Feature]: "
labels: [enhancement]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options: [exswan, exswan_plug, documentation, project tooling]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this change solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the API or behavior you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What workarounds or other designs have you considered?
